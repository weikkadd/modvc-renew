name: ModVC Auto Renew

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  renew:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run renew
        run: node renew.mjs
        env:
          MODVC_REFRESH_TOKEN: ${{ secrets.MODVC_REFRESH_TOKEN }}
          MODVC_RENEW_WITHIN_HOURS: '24'
          MODVC_TG_BOT_TOKEN: ${{ secrets.MODVC_TG_BOT_TOKEN }}
          MODVC_TG_CHAT_ID: ${{ secrets.MODVC_TG_CHAT_ID }}
          MODVC_NOTIFY_TZ_OFFSET: '8'
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}